# TeamFlow production stack — single VPS (2–4 GB RAM is plenty for ~200 users)
# First time:  ./scripts/deploy.sh      Updates:  ./scripts/update.sh
name: teamflow

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }   # logs can never fill the disk

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 1g
    shm_size: 256m
    # Only what Postgres needs — it no longer receives the JWT secret or admin password.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=60
      - -c
      - random_page_cost=1.1
      - -c
      - log_min_duration_statement=500
      - -c
      - idle_in_transaction_session_timeout=60000
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *logging
    networks: [internal]

  api:
    build: ./apps/api
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    mem_limit: 1g
    depends_on:
      postgres:
        condition: service_healthy
    # Explicit list instead of env_file: each container only gets the secrets it needs.
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=768
      API_PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public&connection_limit=15&pool_timeout=20
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      CORS_ORIGIN: https://${APP_DOMAIN}
      REPORT_DEADLINE: ${REPORT_DEADLINE:-18:00}
      APP_TZ: ${APP_TZ:-Asia/Kolkata}
      TZ: ${APP_TZ:-Asia/Kolkata}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      QUIZ_MAX_ATTEMPTS: ${QUIZ_MAX_ATTEMPTS:-3}
      UPLOAD_DIR: /data/uploads
      ACCEL_REDIRECT: ${ACCEL_REDIRECT:-true}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4000/api/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    logging: *logging
    networks: [internal]

  web:
    build:
      context: ./apps/web
      args:
        BACKEND_URL: http://api:4000
    restart: unless-stopped
    init: true
    mem_limit: 512m
    depends_on:
      api:
        condition: service_healthy
    environment:
      BACKEND_URL: http://api:4000
      NODE_OPTIONS: --max-old-space-size=384
    logging: *logging
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    environment:
      APP_DOMAIN: ${APP_DOMAIN}     # required by the envsubst template step
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - uploads:/data/uploads:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --no-check-certificate https://localhost/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging
    networks: [internal, webnet]

volumes:
  pgdata:
  uploads:

networks:
  internal:
  webnet:
